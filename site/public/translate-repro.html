<html><head><meta charset="utf-8"><title>WAIT</title></head><body><pre id="log">starting
</pre><script type="module">
import { env, pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1/dist/transformers.js";
// Same pack the phone uses, served from the public R2 bucket (CORS-enabled).
env.remoteHost = "https://pub-06ebde2d7f0340d79319d029ddcb06aa.r2.dev";
env.remotePathTemplate = "";
env.allowLocalModels = false;
env.allowRemoteModels = true;
const log = (m) => { document.getElementById("log").textContent += m + "\n"; };

  log("RESULT: " + JSON.stringify(text));

  log("ERROR name=" + e?.name);
  log("ERROR message=" + e?.message);
  log("ERROR stack=" + String(e?.stack).split("\n").slice(0,6).join(" | ").slice(0,700));
}
log("DONE");
document.title = "DONE";
